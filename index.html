<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <link rel="apple-touch-icon" href="/logo.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>PobiNotes-線上錯題本</title>
    <script>
      // 偵測 iOS / iPadOS 與 PWA Standalone 模式，解決無瀏海 iPad 回傳 env(safe-area-inset-top)=0 導致狀態列遮擋問題
      try {
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                           window.navigator.standalone === true;
        if (isIOS || isStandalone) {
          document.documentElement.classList.add('has-system-status-bar');
        }
      } catch (e) {}

      // 忽略跨域阻擋、第三方外掛或非致命性良性警告 (如 Brave Shields、Safari 內容阻擋器等引發的 Script error)
      function isBenignOrClippedError(msg) {
        if (!msg) return true;
        var text = String(msg).toLowerCase();
        return text.indexOf('script error') !== -1 ||
               text.indexOf('resizeobserver') !== -1 ||
               text.indexOf('extension') !== -1;
      }

      window.onerror = function(message, source, lineno, colno, error) {
        if (isBenignOrClippedError(message) || (!source && lineno === 0)) {
          console.warn('[PobiNotes] Ignored external cross-origin or benign script message:', message);
          return true; // 阻止向外傳播
        }
        console.error('[PobiNotes Global Error]', { message: message, source: source, lineno: lineno, colno: colno, error: error });
        return false;
      };

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason ? (event.reason.message || String(event.reason)) : '';
        if (isBenignOrClippedError(reason)) {
          console.warn('[PobiNotes] Ignored external unhandled rejection:', reason);
          event.preventDefault();
          return;
        }
        console.error('[PobiNotes Unhandled Rejection]', event.reason);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
